<svg width="680" height="500" viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="680" height="500" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <text x="40" y="46" font-size="15" font-weight="bold" fill="#2C2C2A">Today — three lists, kept by hand</text>

  <rect x="40" y="66" width="160" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="120" y="92" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Talent pool</text>
  <text x="120" y="110" font-size="12" fill="#5F5E5A" text-anchor="middle">your master list</text>

  <line x1="200" y1="96" x2="430" y2="152" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="315" cy="124" r="11" fill="#ffffff" stroke="#888780" stroke-width="1.5"/>
  <line x1="310" y1="119" x2="320" y2="129" stroke="#888780" stroke-width="1.5"/>
  <line x1="320" y1="119" x2="310" y2="129" stroke="#888780" stroke-width="1.5"/>
  <text x="315" y="106" font-size="12" fill="#5F5E5A" text-anchor="middle">not linked</text>

  <rect x="430" y="60" width="200" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="446" y="84" font-size="14" font-weight="bold" fill="#4A1B0C">Territory A</text>
  <text x="446" y="102" font-size="12" fill="#993C1D">+ Jane, added by hand</text>
  <rect x="430" y="122" width="200" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="446" y="146" font-size="14" font-weight="bold" fill="#4A1B0C">Territory B</text>
  <text x="446" y="164" font-size="12" fill="#993C1D">+ Jane, added by hand</text>
  <rect x="430" y="184" width="200" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="446" y="208" font-size="14" font-weight="bold" fill="#4A1B0C">Territory C</text>
  <text x="446" y="226" font-size="12" fill="#993C1D">+ Jane, added by hand</text>

  <text x="40" y="258" font-size="12" fill="#5F5E5A">Same person kept in every list, by hand. The lists drift apart.</text>

  <line x1="40" y1="280" x2="640" y2="280" stroke="#D3D1C7" stroke-width="1"/>

  <text x="40" y="308" font-size="15" font-weight="bold" fill="#2C2C2A">Our proposal — territory is a live view of the pools</text>

  <rect x="40" y="326" width="160" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="120" y="354" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Talent pools</text>
  <text x="120" y="372" font-size="12" fill="#0F6E56" text-anchor="middle">master · reusable</text>

  <line x1="200" y1="358" x2="284" y2="358" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="242" y="350" font-size="12" fill="#5F5E5A" text-anchor="middle">link + rule</text>

  <rect x="288" y="326" width="176" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="376" y="354" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Service territory</text>
  <text x="376" y="372" font-size="12" fill="#0F6E56" text-anchor="middle">live view</text>

  <line x1="464" y1="346" x2="512" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="464" y1="370" x2="512" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="514" y="306" width="122" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="575" y="333" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Map / coverage</text>
  <rect x="514" y="368" width="122" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="575" y="395" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Smart Dispatch</text>

  <text x="40" y="440" font-size="12" fill="#0F6E56">Add to a pool once and every linked territory updates.</text>
  <text x="40" y="462" font-size="12" fill="#5F5E5A">The same rule feeds the map and dispatch — one source of truth.</text>
</svg>
